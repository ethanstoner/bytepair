[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "bytepair"
version = "0.1.0"
description = "Byte-level BPE tokenizers, trained from scratch and verified against tiktoken"
requires-python = ">=3.10"
dependencies = ["regex"]

[project.optional-dependencies]
tiktoken = ["tiktoken"]
dev = ["tiktoken", "tokenizers", "pytest", "maturin"]

[project.scripts]
bytepair = "bytepair.cli:main"

[tool.maturin]
manifest-path = "crates/bytepair-py/Cargo.toml"
python-source = "src"
module-name = "bytepair._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
