[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytepair"
version = "0.1.0"
description = "Byte-level BPE tokenizers, trained from scratch and verified against tiktoken"
requires-python = ">=3.10"
dependencies = ["regex"]

[project.optional-dependencies]
tiktoken = ["tiktoken"]
dev = ["tiktoken", "tokenizers", "pytest"]

[project.scripts]
bytepair = "bytepair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
