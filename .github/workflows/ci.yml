name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust lint and tests
        run: |
          cargo clippy --workspace -- -D warnings
          cargo test -p bytepair-core --release

      - name: Build the extension into a venv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest regex tiktoken tokenizers
          maturin develop --release

      - name: Python tests (both backends)
        run: |
          source .venv/bin/activate
          python -m pytest -q

      - name: Fuzz against tiktoken (committed sample + random strings)
        run: |
          source .venv/bin/activate
          python scripts/fuzz.py --n 100000 --corpus data
